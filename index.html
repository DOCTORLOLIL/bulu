<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BULU</title>
<style>
:root{color-scheme:light;--bg:#F5EFE4;--ink:#14201C;--mut:#5B6B64;--card:#fff;--line:#E3DACA;--acc:#FF8A00;--grn:#075B4B}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font-weight:800;letter-spacing:.14em;font-size:20px}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-inline-start:6px}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px}
.hero{padding:32px 0 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.hero>div:first-child{padding-top:40px}
.hero img{width:100%;aspect-ratio:1/1.05;object-fit:cover;border-radius:28px;display:block}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:0 0 16px;font-weight:800}
.hero p{font-size:19px;color:var(--mut);max-width:620px;margin:0}
h2{font-size:24px;margin:48px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}
.ic img{width:100%;height:100%;border-radius:13px;display:block}
.ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.live{background:#E3F0EA;color:var(--grn);border-color:#BBD9CC}
.card h3{margin:6px 0 0;font-size:20px}
.card p{margin:0;color:var(--mut);font-size:15px;flex:1}
.go{font-weight:700;color:var(--grn);text-decoration:none;margin-top:6px}
.dis .go{color:var(--mut)}
.about{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.ph{width:120px;height:120px;border-radius:50%;background:repeating-linear-gradient(45deg,#E3DACA,#E3DACA 8px,#EFE7D8 8px,#EFE7D8 16px);display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.todo{background:#FFF3DF;border:1px dashed var(--acc);border-radius:8px;padding:2px 8px;color:#8A5200;font-size:14px}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.contact a{border:1px solid var(--line);border-radius:99px;padding:7px 16px;color:var(--ink);text-decoration:none;font-size:15px}
.card.more{background:transparent;border:2px dashed var(--line);align-items:center;justify-content:center;text-align:center;min-height:200px}
.card.more b{font-size:18px}
.soonwrap{position:relative;display:inline-block}
.bubble{position:absolute;bottom:calc(100% + 8px);inset-inline-start:0;background:var(--ink);color:#fff;font-size:14px;padding:8px 12px;border-radius:12px;white-space:nowrap;opacity:0;transform:translateY(4px);pointer-events:none;transition:.18s}
.bubble.on{opacity:1;transform:none}
footer{margin:56px 0 28px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:24px}.hero img{aspect-ratio:1/0.85}.hero>div:first-child{padding-top:0}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">BULU<i></i></div><button class="lang" id="lang" type="button">EN</button></header>
<section class="hero">
<div><h1 data-he="מחפשים בעיות!<br>ואז מוצאים להם פתרונות..." data-en="Looking for problems!<br>Then finding solutions..."></h1>
<p data-he="BULU היא חברה קטנה שיוצרת כלים ואפליקציות. כאן אפשר למצוא את כל הפרויקטים שלנו במקום אחד." data-en="BULU is a small company that builds tools and apps. All our projects, in one place."></p></div>
<div class="side"><img src="portrait.jpg" alt="Avishai Bar Yishai">
<div class="about"><h2 style="margin:0 0 8px;font-size:22px" data-he="מי אני" data-en="About me"></h2>
<b style="font-size:18px" data-he="אבישי בר ישי" data-en="Avishai Bar Yishai"></b>
<p style="margin:6px 0 0;color:var(--mut);font-size:15px" data-he="אב לחמישה וסטנדאפיסט לשעבר. מתנדב בידידים, חובש, איש שיווק, גיימר ויוטיובר. נהנה משעות פרודוקטיביות מול המחשב, וגם משעות של סתם משחק חסר משמעות." data-en="Father of five and former stand-up comedian. Volunteer at Yedidim, medic, marketer, gamer and YouTuber. Loves productive hours at the computer, as well as hours of pointless gaming."></p>
<div class="contact"><a href="mailto:ceo@bulu.ltd">ceo@bulu.ltd</a></div></div></div>
</section>

<h2 data-he="הפרויקטים" data-en="Projects"></h2>
<div class="grid" id="grid"></div>

<footer><span>&copy; 2026 BULU L.T.D.</span></footer>
</div>
<script>
/* Add a new project by adding one entry here. Fields: icon (image file), he/en (name),
   dhe/den (description), st (status key), url (link) or null for "soon". */
var STATUS={live:{he:'פעיל',en:'Live',cls:'live'},test:{he:'בבדיקות',en:'In testing',cls:'live'},dev:{he:'בפיתוח',en:'In development',cls:''}};
var PROJECTS=[
 {icon:'icon-vanspot.png',he:'VanSpot',en:'VanSpot',st:'test',url:'https://vanspot.bulu.ltd',
  dhe:'מפה קהילתית של ספוטים ללינת שטח בוואן ובקרוואן בישראל. מתעדכנת על ידי הקהילה.',
  den:'A community map of overnight spots for vans and caravans in Israel, kept up to date by the community.'},
 {icon:'icon-thumbnail.png',he:'Thumbnail Studio',en:'Thumbnail Studio',st:'live',url:'https://thumbnail.bulu.lol',
  dhe:'יוצרים תמונות ממוזערות ליוטיוב, אינסטגרם וטיקטוק, בחינם ובלי הרשמה.',
  den:'Create thumbnails for YouTube, Instagram and TikTok. Free, no sign-up.'},
 {icon:'icon-chapsuni.png',he:'חפשוני',en:'Chapsuni',st:'dev',url:null,
  dhe:'חפשוני מחליפה את המפות המודפסות והקבוצות בוואטסאפ במערכת אחת לתיאום חיפושי נעדרים, לכל הארגונים המוסמכים. היא מחלקת את השטח, משבצת צוותים ומודדת כיסוי אמיתי לפי GPS. כך החיפוש מהיר יותר ושום אזור לא נשכח.',
  den:'Chapsuni replaces printed maps and WhatsApp groups with one system for coordinating searches for missing people, for all authorized organizations. It divides the area, assigns teams and measures real coverage by GPS, so the search is faster and no area is forgotten.'},
 {icon:'icon-gravemarker.png',he:'Grave Marker',en:'Grave Marker',st:'dev',url:null,
  dhe:'בוחרים בית עלמין או יישוב, מחפשים את שם הנפטר ומקבלים את מיקום הקבר על המפה. מתחילים בבית העלמין באופקים.',
  den:'Choose a cemetery or town, search for a name and see the exact grave location on a map. Starting with the Ofakim cemetery.'}
];
var MORE={he:'עוד פרויקטים בדרך',en:'More projects on the way'};
var SOON={he:'בקרוב',en:'Soon'}, BUBBLE={he:'לא עכשיו, בקרוב. לא מובן לך?',en:"Not now, soon. Don't get it?"};
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
(function(){
var L='he';
try{var s=localStorage.getItem('bulu_lang');if(s==='he'||s==='en')L=s;else L=((navigator.language||'he').toLowerCase().indexOf('he')===0)?'he':'en';}catch(e){L=((navigator.language||'he').toLowerCase().indexOf('he')===0)?'he':'en';}
var timer;
function render(){
 var h='';
 PROJECTS.forEach(function(p,i){
  var st=STATUS[p.st];
  h+='<div class="card'+(p.url?'':' dis')+'"><div class="top"><div class="ic"><img src="'+p.icon+'" alt="'+esc(p[L])+'"></div><span class="tag '+st.cls+'">'+st[L]+'</span></div>'
   +'<h3>'+esc(p[L])+'</h3><p>'+esc(p['d'+L])+'</p>';
  if(p.url){h+='<a class="go" href="'+p.url+'" dir="ltr">'+p.url.replace('https://','')+' \u2192</a>';}
  else{h+='<span class="soonwrap"><a class="go soon" href="#" data-i="'+i+'">'+SOON[L]+'</a><span class="bubble" role="status">'+BUBBLE[L]+'</span></span>';}
  h+='</div>';
 });
 h+='<div class="card more"><b>+</b><span>'+MORE[L]+'</span></div>';
 document.getElementById('grid').innerHTML=h;
 var ss=document.querySelectorAll('.soon');
 for(var i=0;i<ss.length;i++){(function(a){a.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();closeB();var b=a.parentNode.querySelector('.bubble');b.classList.add('on');timer=setTimeout(closeB,2600);});})(ss[i]);}
}
function closeB(){clearTimeout(timer);var o=document.querySelectorAll('.bubble.on');for(var i=0;i<o.length;i++)o[i].classList.remove('on');}
function apply(){
 document.documentElement.lang=L;document.documentElement.dir=(L==='he')?'rtl':'ltr';
 document.title=L==='he'?'BULU | אפליקציות וכלים':'BULU | Apps and tools';
 var n=document.querySelectorAll('[data-he]');for(var i=0;i<n.length;i++){n[i].innerHTML=n[i].getAttribute('data-'+L);}
 document.getElementById('lang').textContent=(L==='he')?'EN':'\u05e2\u05d1';
 render();
}
document.getElementById('lang').addEventListener('click',function(){L=(L==='he')?'en':'he';try{localStorage.setItem('bulu_lang',L);}catch(e){}apply();});
document.addEventListener('click',closeB);
apply();
})();
</script>
</body></html>
